name: fileforge
description: Universal file manipulation, conversion, and media processing utility.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Platform utilities
  path_provider: ^2.1.5
  platform_info: ^4.0.2

  # File handling
  file_picker: ^8.1.7
  mime: ^2.0.0
  share_plus: ^10.1.4

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  equatable: ^2.0.7
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  # fonts:
  #   - family: FileForgeIcons
  #     fonts:
  #       - asset: assets/fonts/FileForgeIcons.ttf
